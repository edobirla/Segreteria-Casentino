<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Come si vota dal telefono — Chiesa del Casentino</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Tutorial animato del voto dal telefono, da proiettare all'assemblea.
   Solo codice: il telefono è disegnato in HTML e i passaggi si animano da soli.
   Tasti: spazio = pausa, frecce = passaggio prima/dopo, doppio clic = tutto schermo. */
:root{--ink:#101311;--ink2:#3E453F;--ink3:#666D66;--bordo:#CFD3C7;--blu:#122B7D;--blu-t:#DEE3F4;
  --verde:#1F4E38;--verde-t:#DBEAE2;--timbro:#8C2E1E;--timbro-t:#F5E1DC;--notte:#0F1D4C;--o:#D6B36A;
  --serif:"Spectral",Georgia,serif;--sans:"Public Sans","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0B1638}
body{font-family:var(--sans);color:#F4F1E8;-webkit-font-smoothing:antialiased}
#palco{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;display:grid;grid-template-columns:620px 1fr;align-items:center;
  background:radial-gradient(60% 80% at 100% 0%,rgba(255,255,255,.07),transparent 60%),radial-gradient(50% 70% at 0% 100%,rgba(0,0,0,.3),transparent 70%),var(--notte)}
/* ---- il racconto a destra ---- */
.dx{padding:0 110px 0 30px;display:flex;flex-direction:column;gap:26px}
.marca{display:flex;align-items:center;gap:16px;position:absolute;top:70px;left:650px}
.marca img{height:46px;filter:brightness(0) invert(1)}
.marca b{font-family:var(--serif);font-size:24px;font-weight:600;display:block;line-height:1.1}
.marca small{font-family:var(--serif);font-style:italic;font-size:17px;opacity:.65}
.passo{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--o)}
.titolo{font-family:var(--serif);font-weight:600;font-size:66px;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.testo{font-size:27px;line-height:1.5;opacity:.85;margin:0;max-width:30ch;text-wrap:pretty}
.cambia{animation:entra .6s cubic-bezier(.2,.8,.2,1) both}
.cambia.t2{animation-delay:.08s} .cambia.t3{animation-delay:.16s}
@keyframes entra{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.barre{position:absolute;left:650px;right:110px;bottom:84px;display:flex;gap:10px}
.barre button{flex:1;height:6px;border:0;padding:0;border-radius:3px;background:rgba(255,255,255,.16);cursor:pointer;overflow:hidden;position:relative}
.barre button i{position:absolute;inset:0;width:0;background:var(--o);border-radius:3px}
.barre button.fatto i{width:100%}
.comandi{position:absolute;right:110px;top:70px;display:flex;gap:10px;opacity:0;transition:opacity .3s}
body.mostra .comandi{opacity:1}
.comandi button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#F4F1E8;font:inherit;font-size:17px;padding:10px 16px;border-radius:10px;cursor:pointer}
/* ---- il telefono ---- */
.sx{display:grid;place-items:center;height:100%;position:relative}
.tel{width:418px;height:872px;border-radius:64px;padding:14px;background:#05080F;box-shadow:0 0 0 2px #2A3354,0 40px 90px rgba(0,0,0,.55),inset 0 0 0 2px #151B2E;position:relative;transform:scale(.88)}
.tel::before{content:"";position:absolute;top:26px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#05080F;z-index:5}
.sc{width:390px;height:844px;border-radius:50px;overflow:hidden;background:#F5F6F2;color:var(--ink);position:relative;display:flex;flex-direction:column;font-size:15px;line-height:1.4}
.dito{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.95);
  box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:20;opacity:0;transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),opacity .3s,transform .15s;pointer-events:none}
.dito.giu{transform:scale(.78);background:rgba(214,179,106,.6)}
/* schermate del telefono, come la pagina vera */
.st-h{background:radial-gradient(90% 140% at 100% 0%,rgba(255,255,255,.12),transparent 60%),var(--blu);color:#fff;padding:64px 18px 14px;display:flex;align-items:center;gap:11px;flex:none}
.st-h img{height:28px;filter:brightness(0) invert(1)}
.st-h b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.1}
.st-h small{font-family:var(--serif);font-style:italic;font-size:13px;opacity:.75}
.st-b{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.st-p{padding:12px 16px 34px;background:#fff;border-top:1px solid #E4E6E0;display:grid;gap:4px;flex:none}
.st-c{margin:auto 0;text-align:center;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:8px}
.st-c h4{font-family:var(--serif);font-size:24px;color:var(--ink);margin:4px 0 0;font-weight:600}
.st-c p{margin:0;line-height:1.45}
.st-ic{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:var(--blu-t);color:var(--blu)}
.st-ic svg{width:32px;height:32px} .st-ic.v{background:var(--verde-t);color:var(--verde)}
.st-attesa{width:80px;height:3px;border-radius:3px;background:var(--blu-t);overflow:hidden;margin-bottom:8px}
.st-attesa i{display:block;width:40%;height:100%;border-radius:3px;background:var(--blu);animation:va 1.3s ease-in-out infinite}
@keyframes va{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.st-bt{width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:600;font-size:16.5px;background:var(--blu);color:#fff;box-shadow:0 4px 10px rgba(18,43,125,.22);transition:background .2s}
.st-bt:disabled{background:#C3C8D3;box-shadow:none}
.st-bt.gh{background:none;color:var(--ink2);box-shadow:none;font-weight:500;padding:8px;text-decoration:underline;text-underline-offset:3px}
.st-form{display:flex;flex-direction:column;gap:12px;margin:auto 0}
.st-form h4{font-family:var(--serif);font-size:24px;margin:0;font-weight:600}
.st-form p{margin:0 0 2px;color:var(--ink3);font-size:14px}
.st-form label{font-size:13px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:5px}
.st-in{font:inherit;font-size:17px;color:var(--ink);border:1.5px solid var(--bordo);border-radius:12px;padding:12px 13px;background:#fff;min-height:50px;display:flex;align-items:center}
.st-in.att{border-color:var(--blu);box-shadow:0 0 0 3px var(--blu-t)}
.st-in.att::after{content:"";width:2px;height:22px;background:var(--blu);margin-left:1px;animation:cursore 1s steps(1) infinite}
@keyframes cursore{50%{opacity:0}}
.st-cod{justify-content:center;letter-spacing:.18em;font-weight:700;font-size:24px}
.st-q{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink3)}
.st-tit{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.15}
.st-prop{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(15,29,76,.07)}
.st-prop small{display:block;font-family:var(--serif);font-style:italic;color:var(--ink3);font-size:13px}
.st-prop b{font-family:var(--serif);font-size:19px;font-weight:600}
.st-quanti{display:inline-block;margin-top:6px;font-size:13.5px;font-weight:600;color:var(--blu);background:var(--blu-t);border-radius:6px;padding:3px 9px}
.st-o{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 13px;border:1.5px solid #D5D9CF;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(15,29,76,.06);transition:border-color .2s,background .2s,opacity .3s}
.st-o.on{border-width:2.5px;padding:9px 12px;border-color:var(--blu);background:#EEF1FA}
.st-o.fav{background:#F1F8F4} .st-o.con{background:#FBF1EF}
.st-o.fav.on{border-color:var(--verde);background:var(--verde-t)} .st-o.con.on{border-color:var(--timbro);background:var(--timbro-t)}
.st-o .n{flex:1;font-size:17px;font-weight:500} .st-o.on .n{font-weight:700}
.st-o i{width:28px;height:28px;border-radius:50%;border:2px solid #9AA096;flex:none;display:grid;place-items:center;color:#fff}
.st-o i svg{width:16px;height:16px}
.st-o.on i{background:var(--blu);border-color:var(--blu)} .st-o.fav.on i{background:var(--verde);border-color:var(--verde)}
.st-o.via{display:none}
.av{width:40px;height:40px;border-radius:50%;background:var(--blu-t);color:var(--blu);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:14px;flex:none}
.st-cerca{position:relative}
.st-cerca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink3)}
.st-cerca .st-in{padding-left:38px;min-height:46px}
.st-cerca .st-in:empty::before{content:"Cerca un nome";color:#9AA096}
.st-el{padding:14px;border-radius:14px;display:flex;flex-direction:column;gap:9px;background:var(--verde-t);border:1px solid #B9D6C6}
.st-el small{font-family:var(--serif);font-weight:600;color:var(--verde);font-size:24px;line-height:1.1}
.st-el-c{display:flex;align-items:center;gap:12px}
.st-el-c b{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.1}
.st-el-ic{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.7);color:var(--verde)}
.st-el-ic svg{width:28px;height:28px}
.st-rr{display:grid;gap:9px;margin-top:6px}
.st-rr div{display:grid;grid-template-columns:minmax(0,1fr) 120px 28px;gap:9px;align-items:center;font-size:15px}
.st-rr i{height:7px;border-radius:4px;background:#E4E6E0;overflow:hidden}
.st-rr i b{display:block;height:100%;border-radius:4px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.st-rr .fav b{background:var(--verde)} .st-rr .con b{background:var(--timbro)} .st-rr .bia span,.st-rr .bia em{color:var(--ink3);font-style:italic}
.st-rr .bia b{background:#9AA096}
.st-rr em{font-style:normal;font-weight:600;text-align:right}
/* la fotocamera */
.cam{flex:1;background:#14161A;position:relative;display:grid;place-items:center;overflow:hidden}
.cam .qr{width:230px;height:230px;background:#F4F1E8;padding:14px;border-radius:10px;transform:scale(.55) rotate(-8deg);opacity:.4;transition:transform 1.6s cubic-bezier(.2,.8,.2,1),opacity 1.2s}
.cam.vicino .qr{transform:scale(1) rotate(0);opacity:1}
.cam .mira{position:absolute;width:270px;height:270px;border-radius:24px;
  background:linear-gradient(#FFD34D,#FFD34D) 0 0/40px 5px no-repeat,linear-gradient(#FFD34D,#FFD34D) 0 0/5px 40px no-repeat,
    linear-gradient(#FFD34D,#FFD34D) 100% 0/40px 5px no-repeat,linear-gradient(#FFD34D,#FFD34D) 100% 0/5px 40px no-repeat,
    linear-gradient(#FFD34D,#FFD34D) 0 100%/40px 5px no-repeat,linear-gradient(#FFD34D,#FFD34D) 0 100%/5px 40px no-repeat,
    linear-gradient(#FFD34D,#FFD34D) 100% 100%/40px 5px no-repeat,linear-gradient(#FFD34D,#FFD34D) 100% 100%/5px 40px no-repeat;opacity:0;transition:opacity .4s}
.cam.vicino .mira{opacity:1}
.cam .scatto{position:absolute;bottom:52px;width:72px;height:72px;border-radius:50%;border:4px solid #fff;box-shadow:inset 0 0 0 4px #14161A,inset 0 0 0 40px #fff}
.cam .banner{position:absolute;top:64px;left:14px;right:14px;background:rgba(245,246,242,.96);color:var(--ink);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transform:translateY(-140%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.cam .banner.su{transform:none}
.cam .banner i{width:38px;height:38px;border-radius:10px;background:var(--blu);flex:none;display:grid;place-items:center;color:#fff}
.cam .banner i svg{width:20px;height:20px}
.cam .banner b{display:block;font-size:15px} .cam .banner span{font-size:13px;color:var(--ink3)}
.dissolvi{animation:dissolvi .45s ease both}
@keyframes dissolvi{from{opacity:0}to{opacity:1}}
</style>
</head>

const testa = `<div class="st-h"><img src="${LOGO}" alt=""><div><b>Chiesa del Casentino</b><small>votazioni</small></div></div>`;

/* un QR disegnato (solo per la scena: non porta da nessuna parte) */
function finto(){
  let s = 11, r = ""; const n = 25, caso = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const occhio = (x, y) => (x < 7 && y < 7) || (x > n - 8 && y < 7) || (x < 7 && y > n - 8);
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    if(occhio(x,y)) continue;
    if(caso() < .48) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  const o = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#F4F1E8"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" style="width:100%;height:100%"><g fill="#0D1A45">${r}${o(0,0)}${o(n-7,0)}${o(0,n-7)}</g></svg>`;
}

/* ---- gli strumenti dell'animazione ---- */
let giro = 0, pausa = false, passo = 0;
const FERMA = {};
const attesa = ms => new Promise((ok, no) => {
  const g = giro; let fatti = 0;
  const t = setInterval(() => { if(g !== giro){ clearInterval(t); no(FERMA); return; } if(!pausa && (fatti += 50) >= ms){ clearInterval(t); ok(); } }, 50);
});
function schermo(corpo, piede=""){
  $("#sc").innerHTML = `<div class="dissolvi" style="display:flex;flex-direction:column;height:100%">${corpo}${piede?`<div class="st-p">${piede}</div>`:""}</div>`;
}
async function scrivi(sel, testo, ms=110){
  const el = $(sel, $("#sc")); el.classList.add("att");
  for(const c of testo){ el.textContent += c; await attesa(ms); }
  el.classList.remove("att");
}
async function tocca(sel){
  const el = typeof sel === "string" ? $(sel, $("#sc")) : sel, d = $("#dito"), tel = $(".tel");
  const a = el.getBoundingClientRect(), b = tel.getBoundingClientRect(), k = b.width / tel.offsetWidth;
  d.style.left = ((a.left + a.width/2 - b.left) / k) + "px"; d.style.top = ((a.top + a.height/2 - b.top) / k) + "px"; d.style.opacity = 1;
  await attesa(800); d.classList.add("giu"); await attesa(170); d.classList.remove("giu"); await attesa(250);
}
const viaDito = () => { $("#dito").style.opacity = 0; };

/* ---- i passaggi ---- */
const scheda = (titolo, opz, piede=true) => schermo(`${testa}<div class="st-b"><div><div class="st-q">Votazione</div><div class="st-tit">${titolo}</div><span class="st-quanti">Scegline uno</span></div>${opz}</div>`,

     schermo(`<div class="cam" id="cam"><div class="qr">${finto()}</div><div class="mira"></div><div class="scatto"></div>

/* ---- la regia ---- */
$("#barre").innerHTML = PASSI.map((_, i) => `<button data-p="${i}" aria-label="Passaggio ${i+1}"><i></i></button>`).join("");
function didascalia(i){
  const p = PASSI[i];
  $("#dx").innerHTML = `<div class="passo cambia">Passaggio ${i+1} di ${PASSI.length}</div><h1 class="titolo cambia t2">${p.t}</h1><p class="testo cambia t3">${p.x}</p>`;
  document.querySelectorAll(".barre button").forEach((b, k) => { b.classList.toggle("fatto", k < i); b.querySelector("i").style.cssText = ""; });
}
async function vai(i){
  const g = ++giro; passo = (i + PASSI.length) % PASSI.length;
  didascalia(passo); viaDito();
  const barra = document.querySelectorAll(".barre button")[passo].querySelector("i");
  const t0 = performance.now(); let fermo = 0, ultimo = t0;
  try{
    // la barra del passaggio si riempie mentre scorre
    const anima = () => { if(g !== giro) return; const ora = performance.now(); if(pausa) fermo += ora - ultimo; ultimo = ora;
      barra.style.width = Math.min(100, (ora - t0 - fermo) / (PASSI[passo].d * 10)) + "%"; requestAnimationFrame(anima); };
    requestAnimationFrame(anima);
    await PASSI[passo].fai(); await attesa(1400);
    if(g === giro) vai(passo + 1);
  }catch(e){ if(e !== FERMA) throw e; }
}
function comando(c){
  if(c === "pausa"){ pausa = !pausa; $('[data-c="pausa"]').textContent = pausa ? "Riprendi" : "Pausa"; }
  if(c === "avanti") vai(passo + 1);
  if(c === "indietro") vai(passo - 1);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-c],[data-p]"); if(!b) return; b.dataset.c ? comando(b.dataset.c) : vai(+b.dataset.p); });
document.addEventListener("keydown", e => {
  if(e.key === " "){ e.preventDefault(); comando("pausa"); }
  if(e.key === "ArrowRight") comando("avanti");
  if(e.key === "ArrowLeft") comando("indietro");
});
addEventListener("dblclick", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
let tm; addEventListener("mousemove", () => { document.body.classList.add("mostra"); clearTimeout(tm); tm = setTimeout(() => document.body.classList.remove("mostra"), 2500); });
const misura = () => { const k = Math.min(innerWidth / 1600, innerHeight / 900); $("#palco").style.transform = `translate(-50%,-50%) scale(${k})`; };
addEventListener("resize", misura); misura();
(document.fonts?.ready || Promise.resolve()).then(() => vai(0));
</script>
